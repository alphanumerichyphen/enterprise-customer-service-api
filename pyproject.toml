[project]
name = "pythonproject"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "psycopg[binary]>=3.2.13",
    "python-dotenv>=1.2.1",
    "sqlalchemy>=2.0.54",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring a live Supabase database",
]